<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PayVoice Assistant</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>PayVoice Assistant</h1>
    <p>Describe a job in plain English. Get a PayPal invoice.</p>
  </header>

  <main>
    <section class="card">
      <h2>Describe the job</h2>
      <textarea id="ai-text" rows="3" placeholder='e.g. "Three logos for Acme Corp at 150 dollars each, due in 14 days"'></textarea>
      <p class="message">Amounts are in USD. The AI only fills the form below, nothing is created until you click Create invoice.</p>
      <div class="row">
        <button type="button" id="ai-btn">Generate invoice</button>
      </div>
      <p id="ai-message" class="message"></p>
    </section>

    <section class="card">
      <h2>New invoice</h2>
      <form id="invoice-form">
        <label>Client name
          <input id="client-name" placeholder="e.g. Acme Corp" required />
        </label>
        <label>Client email (optional)
          <input id="client-email" type="email" placeholder="client@example.com" />
        </label>
        <label>Payment terms
          <select id="terms">
            <option value="DUE_ON_RECEIPT">Due on receipt</option>
            <option value="NET_10">Net 10 days</option>
            <option value="NET_15" selected>Net 15 days</option>
            <option value="NET_30">Net 30 days</option>
            <option value="NET_45">Net 45 days</option>
            <option value="NET_60">Net 60 days</option>
          </select>
        </label>

        <div id="items"></div>
        <button type="button" id="add-item-btn" class="secondary">+ Add item</button>
        <p id="total-line"><strong>Total: $0.00</strong></p>

        <button type="submit" id="create-btn">Create invoice</button>
        <p id="form-message" class="message"></p>
      </form>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Your invoices</h2>
        <button type="button" id="refresh-btn" class="secondary">Refresh</button>
      </div>
      <p id="list-message" class="message"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Invoice</th>
              <th>Client</th>
              <th>Amount</th>
              <th>Due</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="invoice-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
